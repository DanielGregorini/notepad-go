version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: notepad-go-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: notepad
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: ./notepad-go-api
    container_name: notepad-go-api
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      DATABASE_URL: mongodb://admin:admin@mongo:27017/notepad?authSource=admin
      TIME_SYNC_ROOM_S: 30
      TIME_REMOVE_ROOM_D: 7
      JWT_SECRET: d2xSBjsdmk20La937aj7SGnaf
      NODE_ENV: production
    depends_on:
      - mongo

  frontend:
    build:
      context: ./notepad-go
    container_name: notepad-go-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:5001/api/v1
    depends_on:
      - api

volumes:
  mongo_data:
